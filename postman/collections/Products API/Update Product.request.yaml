$kind: http-request
name: Update Product
method: PUT
url: 'http://localhost:3000/api/products/{{newProductId}}'
description: Update an existing product by ID
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Updated Test Product",
      "descripcion": "Updated description from Postman",
      "precio": 149.99,
      "stock": 30,
      "imagen_url": "https://example.com/updated-product.jpg"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response has updated product data", function () {
        const json = pm.response.json();
        pm.expect(json.nombre).to.eql("Updated Test Product");
        pm.expect(json.precio).to.eql(149.99);
        pm.expect(json.stock).to.eql(30);
      });
      pm.test("Response time is less than 2000ms", function () {
        pm.expect(pm.response.responseTime).to.be.below(2000);
      });
